        - originalPrincipal
        - currentPrincipal
        - calculateFromCurrent
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        principalAmount:
          type: number
          format: decimal
        interestRateRuleId:
          type: integer
          format: int64
        appliedAnnualRate:
          type: number
          format: decimal
        startDate:
          type: string
          format: date
        maturityDate:
          type: string
          format: date
        termDays:
          type: integer
          nullable: true
        termMonths:
          type: integer
          nullable: true
