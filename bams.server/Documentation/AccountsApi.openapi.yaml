          $ref: '#/components/schemas/RenewalInstruction'
        payoutAccountId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/FixedDepositStatus'
        originalPrincipal:
          type: number
          format: decimal
        currentPrincipal:
          type: number
          format: decimal
        calculateFromCurrent:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    AccountTypeResponse:
      type: object
      required:
        - id
        - code
        - name
        - minimumOpeningBalance
        - minimumMaintainedBalance
        - allowDeposit
        - allowWithdrawal
        - allowTransfer
        - allowPartialWithdrawal
        - allowForeigner
        - isFixedDeposit
        - allowCitizen
        - citizenRequiredRefer
        - foreignRequiredRefer
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [CURRENT, SAVING, FIXED, CALL]
        minimumOpeningBalance:
          type: number
          format: decimal
        minimumMaintainedBalance:
          type: number
          format: decimal
        dailyTransactionLimit:
          type: number
          format: decimal
          nullable: true
        monthlyTransactionLimit:
          type: number
          format: decimal
          nullable: true
        allowDeposit:
          type: boolean
        allowWithdrawal:
          type: boolean
        allowTransfer:
          type: boolean
        allowPartialWithdrawal:
          type: boolean
        requiredProductId:
          type: integer
          format: int64
          nullable: true
          description: Eligibility prerequisite; a selected customer must own an active account of this type. It does not constrain fixed-deposit payout-account selection.
        isFixedDeposit:
          type: boolean
        allowForeigner:
          type: boolean
        allowCitizen:
          type: boolean
        citizenRequiredRefer:
          type: integer
          minimum: 0
        foreignRequiredRefer:
          type: integer
          minimum: 0

