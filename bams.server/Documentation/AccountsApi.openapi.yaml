        annualRate: { type: number, format: decimal }
        calculatedAmount: { type: number, format: decimal }
        status: { type: string }
        calculatedAt: { type: string, format: date-time }
        postedAt: { type: string, format: date-time, nullable: true }

    AccountResponse:
      type: object
      required:
