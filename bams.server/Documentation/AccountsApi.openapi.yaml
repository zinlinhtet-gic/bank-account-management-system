          format: int64
        accountNo:
          type: string
        accountTypeId:
          type: integer
          format: int64
        accountTypeCode:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        availableBalance:
          type: number
          format: decimal
        ledgerBalance:
          type: number
          format: decimal
        openedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    AccountHolderResponse:
      type: object
